version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Using Node 20"
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules
        - corepack enable
        - npm i -g npm@11
        - npm ci || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
