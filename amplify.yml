version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Using Node 18"
        - nvm install 18
        - nvm use 18
        - echo "Fallback for missing secrets" && export NPM_TOKEN=dummy
        - npm ci || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
