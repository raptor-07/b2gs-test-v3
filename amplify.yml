version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18 
        - nvm use 18
        - npm cache clean --force
        - npm cache verify
        - npm install 
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
