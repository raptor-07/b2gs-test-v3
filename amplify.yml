version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Using Node 18"
        - nvm install 18
        - nvm use 18
        - rm -rf node_modules
        - corepack enable
        - npm i -g npm@10
        - npm ci || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
