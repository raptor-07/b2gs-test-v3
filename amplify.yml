version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18 
        - nvm use 18
        - npm cache clean --force
        - npm cache verify
        - rm -rf node_modules package-lock.json
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
