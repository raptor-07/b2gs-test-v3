version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Custom build using Docker"
        - docker build -t app .
    build:
      commands:
        - docker run -v $(pwd):/app app npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths: []
